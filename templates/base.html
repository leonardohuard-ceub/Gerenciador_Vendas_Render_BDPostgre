<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Loja{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    nav { background: #1f2937; padding: 12px 20px; display: flex; gap: 18px; flex-wrap: wrap; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { margin-top: 14px; padding: 10px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background: #f9fafb; }
    .ok { background: #dcfce7; color: #166534; padding: 10px; border-radius: 6px; margin-bottom: 14px; }
    .erro { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 14px; }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .menu a { display: block; background: #fff; padding: 28px; border-radius: 8px; text-align: center; text-decoration: none; color: #1f2937; font-size: 1.15em; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .menu a:hover { background: #eff6ff; }
    img.mini { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
    .qtd { width: 70px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Início</a>
    <a href="{{ url_for('cad_cliente') }}">Cad. Cliente</a>
    <a href="{{ url_for('cad_produto') }}">Cad. Produto</a>
    <a href="{{ url_for('venda') }}">Venda</a>
    <a href="{{ url_for('consulta') }}">Consulta</a>
  </nav>
  <main>
    {% for categoria, msg in get_flashed_messages(with_categories=true) %}
      <div class="{{ categoria }}">{{ msg }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>

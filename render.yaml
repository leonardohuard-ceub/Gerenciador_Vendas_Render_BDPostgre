# Blueprint do Render: cria o banco e o site de uma vez
databases:
  - name: loja-db
    plan: free
    databaseName: loja
    user: loja

services:
  - type: web
    name: loja
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loja-db
          property: connectionString
